<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="790" viewBox="0 0 1320 790" role="img" aria-labelledby="title desc">
<title id="title">Merge states, keep the content</title>
<desc id="desc">Successive mergers reduce eight counter states to four and then two, preserving the even or odd answer at every tick. States zero and four merge, as do two and six; these pairs then merge into Even. States one and five merge, as do three and seven; these pairs then merge into Odd. Arrows show merging, not time evolution. Merging Even and Odd would lose the chosen distinction.</desc>
<defs><marker id="tip0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#A9BCD9"/></marker><marker id="tip1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#EDB4A8"/></marker></defs><rect width="1320" height="790" fill="#FFFFFF"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="62" font-size="36" fill="#172036" font-weight="600" text-anchor="start">Merge states, keep the content</text><text x="44" y="105" font-size="23" fill="#586276" font-weight="400" text-anchor="start">Keep the even / odd answer at every tick.</text><text x="105" y="158" font-size="25" fill="#586276" font-weight="600" text-anchor="middle">8 states</text><text x="610" y="158" font-size="25" fill="#586276" font-weight="600" text-anchor="middle">4 states</text><text x="1100" y="158" font-size="25" fill="#586276" font-weight="600" text-anchor="middle">2 states</text><text x="1100" y="197" font-size="24" fill="#172036" font-weight="600" text-anchor="middle">The coarsest description</text><path d="M 131 205 C 351.0 205, 351.0 235, 571 235" fill="none" stroke="#A9BCD9" stroke-width="3" stroke-linecap="round" marker-end="url(#tip0)"/><path d="M 131 265 C 351.0 265, 351.0 235, 571 235" fill="none" stroke="#A9BCD9" stroke-width="3" stroke-linecap="round" marker-end="url(#tip0)"/><path d="M 131 345 C 351.0 345, 351.0 375, 571 375" fill="none" stroke="#A9BCD9" stroke-width="3" stroke-linecap="round" marker-end="url(#tip0)"/><path d="M 131 405 C 351.0 405, 351.0 375, 571 375" fill="none" stroke="#A9BCD9" stroke-width="3" stroke-linecap="round" marker-end="url(#tip0)"/><path d="M 131 480 C 351.0 480, 351.0 510, 571 510" fill="none" stroke="#EDB4A8" stroke-width="3" stroke-linecap="round" marker-end="url(#tip1)"/><path d="M 131 540 C 351.0 540, 351.0 510, 571 510" fill="none" stroke="#EDB4A8" stroke-width="3" stroke-linecap="round" marker-end="url(#tip1)"/><path d="M 131 620 C 351.0 620, 351.0 650, 571 650" fill="none" stroke="#EDB4A8" stroke-width="3" stroke-linecap="round" marker-end="url(#tip1)"/><path d="M 131 680 C 351.0 680, 351.0 650, 571 650" fill="none" stroke="#EDB4A8" stroke-width="3" stroke-linecap="round" marker-end="url(#tip1)"/><path d="M 649 235 C 843.0 235, 843.0 305, 1037 305" fill="none" stroke="#A9BCD9" stroke-width="3" stroke-linecap="round" marker-end="url(#tip0)"/><path d="M 649 375 C 843.0 375, 843.0 305, 1037 305" fill="none" stroke="#A9BCD9" stroke-width="3" stroke-linecap="round" marker-end="url(#tip0)"/><path d="M 649 510 C 843.0 510, 843.0 580, 1037 580" fill="none" stroke="#EDB4A8" stroke-width="3" stroke-linecap="round" marker-end="url(#tip1)"/><path d="M 649 650 C 843.0 650, 843.0 580, 1037 580" fill="none" stroke="#EDB4A8" stroke-width="3" stroke-linecap="round" marker-end="url(#tip1)"/><circle cx="105" cy="205" r="25" fill="#EEF3FA" stroke="#002878" stroke-width="2.5"/><text x="105" y="214.52" font-size="28" fill="#002878" font-weight="600" text-anchor="middle">0</text><circle cx="105" cy="265" r="25" fill="#EEF3FA" stroke="#002878" stroke-width="2.5"/><text x="105" y="274.52" font-size="28" fill="#002878" font-weight="600" text-anchor="middle">4</text><circle cx="105" cy="345" r="25" fill="#EEF3FA" stroke="#002878" stroke-width="2.5"/><text x="105" y="354.52" font-size="28" fill="#002878" font-weight="600" text-anchor="middle">2</text><circle cx="105" cy="405" r="25" fill="#EEF3FA" stroke="#002878" stroke-width="2.5"/><text x="105" y="414.52" font-size="28" fill="#002878" font-weight="600" text-anchor="middle">6</text><circle cx="105" cy="480" r="25" fill="#FFF0EA" stroke="#C63B2C" stroke-width="2.5"/><text x="105" y="489.52" font-size="28" fill="#C63B2C" font-weight="600" text-anchor="middle">1</text><circle cx="105" cy="540" r="25" fill="#FFF0EA" stroke="#C63B2C" stroke-width="2.5"/><text x="105" y="549.52" font-size="28" fill="#C63B2C" font-weight="600" text-anchor="middle">5</text><circle cx="105" cy="620" r="25" fill="#FFF0EA" stroke="#C63B2C" stroke-width="2.5"/><text x="105" y="629.52" font-size="28" fill="#C63B2C" font-weight="600" text-anchor="middle">3</text><circle cx="105" cy="680" r="25" fill="#FFF0EA" stroke="#C63B2C" stroke-width="2.5"/><text x="105" y="689.52" font-size="28" fill="#C63B2C" font-weight="600" text-anchor="middle">7</text><circle cx="610" cy="235" r="38" fill="#EEF3FA" stroke="#002878" stroke-width="2.5"/><text x="610" y="243.16" font-size="24" fill="#002878" font-weight="600" text-anchor="middle">0, 4</text><circle cx="610" cy="375" r="38" fill="#EEF3FA" stroke="#002878" stroke-width="2.5"/><text x="610" y="383.16" font-size="24" fill="#002878" font-weight="600" text-anchor="middle">2, 6</text><circle cx="610" cy="510" r="38" fill="#FFF0EA" stroke="#C63B2C" stroke-width="2.5"/><text x="610" y="518.16" font-size="24" fill="#C63B2C" font-weight="600" text-anchor="middle">1, 5</text><circle cx="610" cy="650" r="38" fill="#FFF0EA" stroke="#C63B2C" stroke-width="2.5"/><text x="610" y="658.16" font-size="24" fill="#C63B2C" font-weight="600" text-anchor="middle">3, 7</text><circle cx="1100" cy="305" r="62" fill="#EEF3FA" stroke="#002878" stroke-width="2.5"/><text x="1100" y="314.86" font-size="29" fill="#002878" font-weight="600" text-anchor="middle">Even</text><circle cx="1100" cy="580" r="62" fill="#FFF0EA" stroke="#C63B2C" stroke-width="2.5"/><text x="1100" y="589.86" font-size="29" fill="#C63B2C" font-weight="600" text-anchor="middle">Odd</text><text x="660" y="755" font-size="25" fill="#586276" font-weight="400" text-anchor="middle">Merge again and the even / odd distinction is lost.</text></g></svg>
