<svg xmlns="http://www.w3.org/2000/svg" width="520" height="840" viewBox="0 0 520 840" role="img" aria-labelledby="title desc">
<title id="title">Merge states, keep the content</title>
<desc id="desc">Successive mergers reduce eight counter states to four and then two, preserving the even or odd answer at every tick. States zero and four merge, as do two and six; these pairs then merge into Even. States one and five merge, as do three and seven; these pairs then merge into Odd. Arrows show merging, not time evolution. Merging Even and Odd would lose the chosen distinction.</desc>
<defs><marker id="tip0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#A9BCD9"/></marker><marker id="tip1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#EDB4A8"/></marker></defs><rect width="520" height="840" fill="#FFFFFF"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="49" font-size="34" fill="#172036" font-weight="600" text-anchor="start">Merge states,</text><text x="30" y="90" font-size="34" fill="#172036" font-weight="600" text-anchor="start">keep the content</text><text x="30" y="133" font-size="23" fill="#586276" font-weight="400" text-anchor="start">Keep the even / odd answer</text><text x="30" y="164" font-size="23" fill="#586276" font-weight="400" text-anchor="start">at every tick.</text><text x="260" y="208" font-size="25" fill="#586276" font-weight="600" text-anchor="middle">8 states</text><text x="260" y="358" font-size="25" fill="#586276" font-weight="600" text-anchor="middle">4 states</text><path d="M 45 269 C 45 332.5, 75 332.5, 75 396" fill="none" stroke="#A9BCD9" stroke-width="3" stroke-linecap="round" marker-end="url(#tip0)"/><path d="M 105 269 C 105 332.5, 75 332.5, 75 396" fill="none" stroke="#A9BCD9" stroke-width="3" stroke-linecap="round" marker-end="url(#tip0)"/><path d="M 165 269 C 165 332.5, 195 332.5, 195 396" fill="none" stroke="#A9BCD9" stroke-width="3" stroke-linecap="round" marker-end="url(#tip0)"/><path d="M 225 269 C 225 332.5, 195 332.5, 195 396" fill="none" stroke="#A9BCD9" stroke-width="3" stroke-linecap="round" marker-end="url(#tip0)"/><path d="M 295 269 C 295 332.5, 325 332.5, 325 396" fill="none" stroke="#EDB4A8" stroke-width="3" stroke-linecap="round" marker-end="url(#tip1)"/><path d="M 355 269 C 355 332.5, 325 332.5, 325 396" fill="none" stroke="#EDB4A8" stroke-width="3" stroke-linecap="round" marker-end="url(#tip1)"/><path d="M 415 269 C 415 332.5, 445 332.5, 445 396" fill="none" stroke="#EDB4A8" stroke-width="3" stroke-linecap="round" marker-end="url(#tip1)"/><path d="M 475 269 C 475 332.5, 445 332.5, 445 396" fill="none" stroke="#EDB4A8" stroke-width="3" stroke-linecap="round" marker-end="url(#tip1)"/><path d="M 75 474 C 75 528.0, 135 528.0, 135 582" fill="none" stroke="#A9BCD9" stroke-width="3" stroke-linecap="round" marker-end="url(#tip0)"/><path d="M 195 474 C 195 528.0, 135 528.0, 135 582" fill="none" stroke="#A9BCD9" stroke-width="3" stroke-linecap="round" marker-end="url(#tip0)"/><path d="M 325 474 C 325 528.0, 385 528.0, 385 582" fill="none" stroke="#EDB4A8" stroke-width="3" stroke-linecap="round" marker-end="url(#tip1)"/><path d="M 445 474 C 445 528.0, 385 528.0, 385 582" fill="none" stroke="#EDB4A8" stroke-width="3" stroke-linecap="round" marker-end="url(#tip1)"/><circle cx="45" cy="245" r="22" fill="#EEF3FA" stroke="#002878" stroke-width="2.5"/><text x="45" y="254.52" font-size="28" fill="#002878" font-weight="600" text-anchor="middle">0</text><circle cx="105" cy="245" r="22" fill="#EEF3FA" stroke="#002878" stroke-width="2.5"/><text x="105" y="254.52" font-size="28" fill="#002878" font-weight="600" text-anchor="middle">4</text><circle cx="165" cy="245" r="22" fill="#EEF3FA" stroke="#002878" stroke-width="2.5"/><text x="165" y="254.52" font-size="28" fill="#002878" font-weight="600" text-anchor="middle">2</text><circle cx="225" cy="245" r="22" fill="#EEF3FA" stroke="#002878" stroke-width="2.5"/><text x="225" y="254.52" font-size="28" fill="#002878" font-weight="600" text-anchor="middle">6</text><circle cx="295" cy="245" r="22" fill="#FFF0EA" stroke="#C63B2C" stroke-width="2.5"/><text x="295" y="254.52" font-size="28" fill="#C63B2C" font-weight="600" text-anchor="middle">1</text><circle cx="355" cy="245" r="22" fill="#FFF0EA" stroke="#C63B2C" stroke-width="2.5"/><text x="355" y="254.52" font-size="28" fill="#C63B2C" font-weight="600" text-anchor="middle">5</text><circle cx="415" cy="245" r="22" fill="#FFF0EA" stroke="#C63B2C" stroke-width="2.5"/><text x="415" y="254.52" font-size="28" fill="#C63B2C" font-weight="600" text-anchor="middle">3</text><circle cx="475" cy="245" r="22" fill="#FFF0EA" stroke="#C63B2C" stroke-width="2.5"/><text x="475" y="254.52" font-size="28" fill="#C63B2C" font-weight="600" text-anchor="middle">7</text><circle cx="75" cy="435" r="38" fill="#EEF3FA" stroke="#002878" stroke-width="2.5"/><text x="75" y="443.16" font-size="24" fill="#002878" font-weight="600" text-anchor="middle">0, 4</text><circle cx="195" cy="435" r="38" fill="#EEF3FA" stroke="#002878" stroke-width="2.5"/><text x="195" y="443.16" font-size="24" fill="#002878" font-weight="600" text-anchor="middle">2, 6</text><circle cx="325" cy="435" r="38" fill="#FFF0EA" stroke="#C63B2C" stroke-width="2.5"/><text x="325" y="443.16" font-size="24" fill="#C63B2C" font-weight="600" text-anchor="middle">1, 5</text><circle cx="445" cy="435" r="38" fill="#FFF0EA" stroke="#C63B2C" stroke-width="2.5"/><text x="445" y="443.16" font-size="24" fill="#C63B2C" font-weight="600" text-anchor="middle">3, 7</text><circle cx="135" cy="635" r="52" fill="#EEF3FA" stroke="#002878" stroke-width="2.5"/><text x="135" y="644.52" font-size="28" fill="#002878" font-weight="600" text-anchor="middle">Even</text><circle cx="385" cy="635" r="52" fill="#FFF0EA" stroke="#C63B2C" stroke-width="2.5"/><text x="385" y="644.52" font-size="28" fill="#C63B2C" font-weight="600" text-anchor="middle">Odd</text><text x="260" y="644" font-size="25" fill="#586276" font-weight="600" text-anchor="middle">2 states</text><text x="260" y="730" font-size="27" fill="#172036" font-weight="600" text-anchor="middle">The coarsest description</text><text x="260" y="778" font-size="24" fill="#586276" font-weight="400" text-anchor="middle">Merge again and the</text><text x="260" y="810" font-size="24" fill="#586276" font-weight="400" text-anchor="middle">even / odd distinction is lost.</text></g></svg>
